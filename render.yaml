services:
  - type: web
    name: ofm-free
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "no build step"
    startCommand: bash start.sh
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: OFM_HOME
        value: /data/ofm
    disk:
      name: ofm-data
      mountPath: /data
      sizeGB: 1
