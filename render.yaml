services:
  - type: web
    name: ofm-free
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "no build step"
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.19.0"
      - key: OFM_HOME
        value: /opt/render/project/ofm-data
      - key: OFM_CLIENT_KEY
        generateValue: true
